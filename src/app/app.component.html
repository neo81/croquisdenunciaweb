<!-- app.component.html -->

<div class="page-root">

  <!-- ══════════════════════════════════════════════════════════
       HEADER: Formulario + Toolbar
  ══════════════════════════════════════════════════════════ -->
  <header class="panel panel--header">

    <div class="panel-title-row">
      <span class="panel-badge">Siniestro</span>
      <h1 class="panel-title">Reporte de Validación de Integridad</h1>
    </div>

    <!-- Fila de combos -->
    <div class="form-grid">
      <label class="field-label">
        <span class="field-name">Tipo de accidente</span>
        <select class="field-select" [(ngModel)]="form.tipoAccidente">
          <option value="">Seleccione</option>
          <option *ngFor="let item of accidentesApi" [value]="item.COD_T_ACCIDENTE">
            {{ item.X_ACCIDENTE }}
          </option>
        </select>
      </label>

      <label class="field-label">
        <span class="field-name">Lugar del siniestro</span>
        <select class="field-select" [(ngModel)]="form.tipoLugarSiniestro">
          <option value="">Seleccione</option>
          <option value="Calle">Calle</option>
          <option value="Ruta">Ruta</option>
        </select>
      </label>

      <label class="field-label">
        <span class="field-name">Tipo de lugar</span>
        <select class="field-select" [(ngModel)]="form.tipoLugar">
          <option value="">Seleccione</option>
          <option value="Cruce">Cruce</option>
          <option value="Rotonda">Rotonda</option>
        </select>
      </label>

      <label class="field-label">
        <span class="field-name">Tipo de colisión</span>
        <select class="field-select" [(ngModel)]="form.tipoColision">
          <option value="">Seleccione</option>
          <option value="Choque">Choque</option>
        </select>
      </label>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">

      <!-- Selector de fondo -->
      <div class="toolbar-group toolbar-group--fondo">
        <span class="toolbar-label">Fondo</span>
        <select class="field-select field-select--bg" [(ngModel)]="selectedBackground" (ngModelChange)="onSelectBackground($event)">
          <option value="">— Blanco —</option>
          <option *ngFor="let bg of backgrounds" [value]="bg.file">{{ bg.label }}</option>
        </select>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Herramientas de dibujo -->
      <div class="toolbar-group">
        <input
          type="color"
          [(ngModel)]="strokeColor"
          class="color-swatch"
          [disabled]="!hasBackground"
          title="Color de trazo"
        />
        <button
          class="btn"
          [class.btn--active]="isDrawingMode"
          [disabled]="!hasBackground"
          (click)="toggleDrawingMode()"
          title="Modo dibujo libre"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          Dibujar
        </button>
        <button class="btn btn--secondary" [disabled]="!hasBackground" (click)="addText()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
          Texto
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Herramientas de transformación -->
      <div class="toolbar-group">
        <button class="btn btn--secondary btn--icon" [disabled]="!selectedNode" (click)="flipHorizontal()" title="Voltear horizontal">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
          Flip H
        </button>
        <button class="btn btn--secondary btn--icon" [disabled]="!selectedNode" (click)="flipVertical()" title="Voltear vertical">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
          Flip V
        </button>
        <button class="btn btn--secondary" [disabled]="!selectedNode" (click)="duplicateSelected()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Duplicar
        </button>
        <button class="btn btn--secondary" [disabled]="!selectedNode" (click)="bringToFront()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Frente
        </button>
      </div>

      <div class="toolbar-divider"></div>

      <!-- Acciones globales -->
      <div class="toolbar-group">
        <button class="btn btn--danger" (click)="clearCanvas()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          Limpiar
        </button>
        <button class="btn btn--success" (click)="saveCroquis()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Guardar JSON
        </button>
        <button class="btn btn--warning" (click)="loadCroquis()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Cargar JSON
        </button>
        <button class="btn btn--secondary" (click)="exportImage()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Imagen
        </button>
      </div>

    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════
       CANVAS EDITOR (sidebars + stage)
  ══════════════════════════════════════════════════════════ -->
  <main class="panel panel--canvas">
    <app-canvas-editor
      #canvasEditor
      [(savedJson)]="savedJson"
      [strokeColor]="strokeColor"
      [backgroundFile]="selectedBackground"
    ></app-canvas-editor>
  </main>

  <!-- ══════════════════════════════════════════════════════════
       FOOTER: Textareas
  ══════════════════════════════════════════════════════════ -->
  <footer class="panel panel--footer">
    <div class="textarea-row">
      <div class="field-block">
        <label class="textarea-label">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Descripción del siniestro
        </label>
        <textarea class="field-textarea" [(ngModel)]="form.descripcion" rows="3" placeholder="Describa las circunstancias del siniestro..."></textarea>
      </div>

      <div class="field-block">
        <label class="textarea-label">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          Datos JSON del croquis
        </label>
        <textarea class="field-textarea field-textarea--mono" [(ngModel)]="savedJson" rows="3" placeholder='Pegue aquí el JSON o presione "Guardar JSON" para generarlo...'></textarea>
      </div>
    </div>
  </footer>

</div>
